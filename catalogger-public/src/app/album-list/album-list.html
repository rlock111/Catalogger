@for (album of albums; track album._id) {
  @for (review of album.reviews; track review) {
    <div class="card text-bg-dark review-card mb-3">
      <div class="card-body">
        <div class="row">
          <div class="col-4">
            <img class="img-fluid rounded" src="{{ album.coverImage }}" alt="{{ album.title }}">
          </div>
          <div class="col-8">
            <h4>{{ album.title }}</h4>
            <p class="rating text-warning">
              @for (star of [1, 2, 3, 4, 5]; track star) {
                <i class="{{ star <= review.rating ? 'fa-solid' : 'fa-regular' }} fa-star"></i>
              }
            </p>
            <p>{{ album.artist }}</p>
            <p>{{ review.reviewText }}</p>
            <a class="btn btn-primary btn-green float-end" href="{{ album.spotifyUrl }}">Listen on Spotify</a>
            <small class="reviewTimestamp">{{ review.createdOn | reviewDate }}</small>
          </div>
        </div>
      </div>
    </div>
  }
}
